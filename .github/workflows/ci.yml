name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEPESCHE_TEAM: beispiel/glossar-team.tsv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Proben prüfen
        run: python3 depesche.py check messung/e2.txt
      - name: Skill erzeugen
        run: python3 depesche.py skill - > /dev/null
      - name: Skill-Zip bauen und prüfen
        run: |
          python3 depesche.py skill --zip
          test "$(unzip -Z1 skill/depesche.zip)" = "$(printf 'depesche/\ndepesche/SKILL.md')"
          python3 depesche.py verify skill/depesche.zip
      - name: Öffentliche Zip wie im Release (nur Kern)
        run: |
          python3 depesche.py --kern skill --zip dist/depesche.zip
          python3 depesche.py --kern verify dist/depesche.zip
          if python3 depesche.py --kern verify skill/depesche.zip > /dev/null; then
            echo "::error::Zip mit Teamteil gilt als öffentlich"; exit 1
          fi
