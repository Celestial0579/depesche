name: Release

# Tag v* auf einem Commit von main -> öffentliche Skill-Zip nur aus dem Kern (ohne Teamteil),
# SHA256SUMS.txt, Herkunftsnachweis (Build-Provenance) und Release. Tags mit "-" (v1.0.0-beta.1)
# werden Vorabversionen.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Release anlegen
      id-token: write          # Sigstore-Zertifikat für den Herkunftsnachweis
      attestations: write      # Herkunftsnachweis speichern
      artifact-metadata: write # Speichereintrag zum Herkunftsnachweis
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag prüfen
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $TAG ist keine Version vX.Y.Z[-vor]"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG zeigt auf keinen Commit von main"; exit 1
          fi

      - name: Tests
        env:
          DEPESCHE_TEAM: beispiel/glossar-team.tsv
        run: python3 -m unittest discover -s tests -v

      - name: Öffentliche Skill-Zip bauen (nur Kern)
        run: |
          mkdir dist
          python3 depesche.py --kern skill --zip dist/depesche.zip
          python3 depesche.py --kern verify dist/depesche.zip
          test "$(unzip -Z1 dist/depesche.zip)" = "$(printf 'depesche/\ndepesche/SKILL.md')"
          cd dist
          sha256sum depesche.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Herkunftsnachweis
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/depesche.zip

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vorab=()
          if [[ "$TAG" == *-* ]]; then vorab=(--prerelease); fi
          cat > notes.md <<EOF
          Skill **depesche** for Claude Desktop and claude.ai, built from the core glossary only (no team rules, paths or words).

          Import: Customize -> Skills -> + -> Upload a skill -> \`depesche.zip\`. Code execution must be on.

          Verify:
          \`\`\`
          sha256sum -c SHA256SUMS.txt
          gh attestation verify depesche.zip --repo $GITHUB_REPOSITORY
          \`\`\`
          EOF
          gh release create "$TAG" dist/depesche.zip dist/SHA256SUMS.txt \
            --verify-tag "${vorab[@]}" --title "Depesche $TAG" --notes-file notes.md
